name: Update rates and deploy
on:
  schedule:
    - cron: '30 17 * * 1-5'   # weekdays, after the ECB publishes (about 03:30 Brisbane next day)
    - cron: '15 */6 * * *'    # every 6 hours: provider quotes + rates
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Fetch latest rates
        run: node scripts/update-rates.mjs
      - name: Fetch latest provider quotes
        run: node scripts/update-providers.mjs
      - run: npm test
      - name: Build (live mode hides unverified providers)
        run: OZ_LIVE=1 npm run build
      - name: Go-live check (warns only)
        run: node scripts/launch-check.mjs
      - name: Commit updated rates
        run: |
          git config user.name "ozyen-bot"
          git config user.email "ozyen-bot@users.noreply.github.com"
          git add public/rates.json public/providers.json
          git diff --cached --quiet || (git commit -m "chore: update rates and provider quotes" && git push)
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
